logging.file.name=logs/reciter8.log
logging.level.root=INFO
server.port=5006
#server.servlet.context-path=/pubmed
server.forward-headers-strategy=FRAMEWORK
springdoc.api-docs.path=/pubmed/v3/api-docs
#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.swagger-ui.disable-swagger-default-url=true
#springdoc.swagger-ui.url=/v3/api-docs/swagger-config
header.logging.enabled=false

# Spring Boot 2.6+ defaults to PATH_PATTERN_PARSER, which fails at startup with
# Springfox 3.0.0. Keep the legacy AntPathMatcher so Swagger/Springfox loads.
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER