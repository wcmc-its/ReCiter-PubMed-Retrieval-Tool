name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Amazon Corretto 21
      uses: actions/setup-java@v6
      with:
        distribution: corretto
        java-version: '21'
        cache: maven

    - name: Verify Java version
      run: java -version

    - name: Build with Maven
      run: mvn -B package --file pom.xml
